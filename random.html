<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机训练</title><link rel="stylesheet" href="modes.css"><style>body{background:#777;display:grid;place-items:center;min-height:100vh}.modal{width:min(1000px,calc(100% - 28px));max-height:92vh;overflow:auto;background:#f4f8fc;border-radius:30px;padding:34px 40px 0;color:#142039}.close{float:right;border:0;background:none;font-size:46px;color:#40516a}.modal h2{font-size:32px;margin:22px 0 46px}.intro,.year-box{background:#fff;border-radius:20px;padding:28px 26px;margin-bottom:38px}.intro{font-size:20px;line-height:1.7;color:#475873}.setting-head{font-size:24px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.toggle{width:104px;height:54px;border:4px solid #7d7a86;border-radius:30px;background:#eee}.toggle i{display:block;width:32px;height:32px;border-radius:50%;background:#7d7a86}.modal h3{font-size:22px;margin:26px 0 14px}.choices{display:flex;gap:18px;flex-wrap:wrap}.choices button,.year-box button,footer button{border:2px solid #dbe4ef;background:#f8fbff;border-radius:14px;padding:15px 32px;font-size:20px;color:#142039}.choices .selected{background:#dfeafd;border-color:#2868ed;color:#2868ed;font-weight:800}.year-box{border:2px solid #e0e8f1;background:transparent}.year-box label{display:block;font-size:18px;font-weight:700;margin:18px 0 10px}.two button{flex:1}footer{position:sticky;bottom:0;display:flex;gap:22px;background:#f4f8fc;padding:20px 0}footer button{flex:1;font-weight:800}.start{background:#2868ed!important;color:#fff!important;border-color:#2868ed!important}@media(max-width:600px){.modal{padding:25px 20px 0}.modal h2{font-size:28px}.intro{font-size:16px}.choices button{font-size:16px;padding:12px 18px}}
</style></head><body><section class="modal"><button class="close" onclick="history.back()">×</button><h2>随机训练</h2><div class="intro">随机训练完全随机选取一段未知时间的股票走势的150根K线进行模拟交易，可指定一只股票进行针对性的训练。</div><div class="setting-head">训练指定的股票 <button class="toggle"><i></i></button></div><h3>市场类型</h3><div class="choices"><button class="selected">不限</button><button>主板</button><button>创业板</button><button>科创板</button></div><h3>时间周期</h3><div class="choices"><button>5分钟</button><button>1小时</button><button class="selected">1天</button></div><div class="year-box"><h3>▣ 随机年份区间</h3><label>区间开始</label><div class="choices two"><button class="selected">◉　不限</button><button>□　选择年份</button></div><label>区间结束</label><div class="choices two"><button class="selected">◉　不限</button><button>□　选择年份</button></div></div><h3>复权方式</h3><div class="choices two"><button class="selected">◉　前复权</button><button>◯　后复权</button></div><footer><button onclick="history.back()">取消</button><button class="start" onclick="location.href='index.html'">开始训练</button></footer></section></body></html>
